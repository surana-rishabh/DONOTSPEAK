name: do-not-say-it
region: blr
services:
  - name: web
    environment_slug: node-js
    source_dir: /
    build_command: npm ci && npm run build
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
        scope: RUN_TIME
      - key: DEMO_MODE
        value: "true"
        scope: RUN_TIME
      - key: GEMMA_TURN_TIMEOUT_MS
        value: "11000"
        scope: RUN_TIME
    health_check:
      http_path: /api/health
    routes:
      - path: /
